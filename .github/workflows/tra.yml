name: Update TRA timetable

on:
  schedule:
    # 00:30 Asia/Taipei (Taiwan has no DST) = 16:30 UTC
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and slim TRA data
        run: python scripts/fetch_tra.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No timetable changes."
          else
            git commit -m "Update TRA timetable ($(TZ=Asia/Taipei date +%Y-%m-%d))"
            git push
          fi
